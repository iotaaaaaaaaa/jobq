services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobq
      POSTGRES_PASSWORD: jobq
      POSTGRES_DB: jobq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobq"]
      interval: 2s
      timeout: 2s
      retries: 20

  jobq:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobq:jobq@db:5432/jobq?sslmode=disable
    ports:
      - "8080:8080"
